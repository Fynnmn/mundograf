name: Deploy a Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Arma dist/ (página + panel) y la plantilla que usan las Functions
      - name: Armar la página y el panel
        run: node build.mjs

      # Publica dist/ junto con functions/ (portada, vista previa, API del panel y fotos)
      - name: Deploy a Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "514cfdfb4bebad6d97f53770364293bb"
          command: pages deploy dist --project-name=mundograf --branch=main
